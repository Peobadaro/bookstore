[tool.poetry]
name = "bookstore"
version = "0.1.0"
description = "Bookstore API - Projeto final EBAC (Django REST Framework)"
authors = ["Pedro Badaró <badaro1988@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
Django = "^5.2"
djangorestframework = "^3.15"
django-extensions = "^3.2"
whitenoise = "^6.7"
gunicorn = "^23.0"
GitPython = "^3.1"
psycopg2-binary = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
factory-boy = "^3.3"
flake8 = "^7.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
